<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="40" y="20" width="600" height="280" rx="24" fill="#FFF5E6"/>

  <!-- Decorative elements -->
  <!-- Stars -->
  <text x="70" y="65" font-size="28" fill="#FF6B35" opacity="0.3">★</text>
  <text x="85" y="55" font-size="16" fill="#FFD93D" opacity="0.5">★</text>
  <text x="580" y="65" font-size="24" fill="#FF6B35" opacity="0.3">★</text>
  <text x="600" y="80" font-size="14" fill="#FFD93D" opacity="0.4">★</text>

  <!-- Sparkles -->
  <text x="560" y="280" font-size="20" fill="#FF6B35" opacity="0.25">✨</text>
  <text x="120" y="275" font-size="18" fill="#FFD93D" opacity="0.3">✨</text>

  <!-- Shin-chan style face -->
  <!-- Head -->
  <ellipse cx="240" cy="160" rx="85" ry="90" fill="#FDBC7E"/>

  <!-- Hair (top curve) -->
  <path d="M170 100 Q200 40 240 30 Q280 20 310 100" fill="#3D2B1F" stroke="#2A1A0F" stroke-width="2"/>
  <path d="M175 95 Q200 50 240 40 Q275 35 305 95" fill="#5C3D2E"/>

  <!-- Eyes -->
  <ellipse cx="210" cy="150" rx="18" ry="20" fill="white"/>
  <ellipse cx="270" cy="150" rx="18" ry="20" fill="white"/>
  <ellipse cx="214" cy="152" rx="10" ry="12" fill="#1A1A2E"/>
  <ellipse cx="274" cy="152" rx="10" ry="12" fill="#1A1A2E"/>
  <!-- Eye shine -->
  <ellipse cx="219" cy="147" rx="4" ry="4" fill="white"/>
  <ellipse cx="279" cy="147" rx="4" ry="4" fill="white"/>

  <!-- Eyebrows -->
  <path d="M192 130 Q210 118 230 128" fill="none" stroke="#3D2B1F" stroke-width="3" stroke-linecap="round"/>
  <path d="M250 128 Q270 118 288 130" fill="none" stroke="#3D2B1F" stroke-width="3" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="240" cy="168" rx="5" ry="4" fill="#E89F65"/>

  <!-- Mouth (big smile) -->
  <path d="M210 185 Q240 205 270 185" fill="none" stroke="#2A1A0F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <ellipse cx="188" cy="175" rx="14" ry="8" fill="#FFB5B5" opacity="0.4"/>
  <ellipse cx="292" cy="175" rx="14" ry="8" fill="#FFB5B5" opacity="0.4"/>

  <!-- Speech bubble -->
  <path d="M310 90 Q400 60 480 85 Q520 100 510 130 Q500 165 440 170 L440 195 L410 170 Q350 175 320 160 Q280 145 300 110 Z" fill="white" stroke="#FF6B35" stroke-width="2"/>
  <text x="335" y="118" font-family="sans-serif" font-size="11" fill="#FF6B35" font-weight="500">オラは</text>
  <text x="335" y="138" font-family="sans-serif" font-size="11" fill="#FF6B35" font-weight="500">しんのすけ！</text>
  <text x="335" y="158" font-family="sans-serif" font-size="10" fill="#666" font-weight="400">我是小新！5岁！</text>

  <!-- Title text -->
  <text x="340" y="230" font-family="sans-serif" font-size="22" fill="#FF6B35" font-weight="500">小新的日语教室</text>
  <text x="340" y="255" font-family="sans-serif" font-size="12" fill="#999" font-weight="400">しんちゃんと一緒に日本語を学ぼう！</text>

  <!-- Bottom decoration -->
  <rect x="40" y="285" width="600" height="15" rx="7" fill="#FF6B35" opacity="0.15"/>
</svg>
